name: forma

# Existing Traefik, external intranet network,
# leresolver certificates and registry image. No application port is published.
services:
  app:
    image: ${REGISTRY_HOST:-registry.inflake.fun}/inflake/forma:${FORMA_TAG:-main}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LCT_ACCESS_TOKEN: ${LCT_ACCESS_TOKEN:?Set a strong LCT_ACCESS_TOKEN in .env before public deployment}
      LCT_PUBLIC_URL: https://${LCT_DOMAIN:-forma.inflake.fun}
      LCT_RENDERER: local
      LCT_DATA_DIR: /data
      LCT_APP_ROOT: /app
    volumes:
      - forma-data:/data
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 3g
    cpus: 2
    pids_limit: 256
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${LCT_PROXY_NETWORK:-intranet}
      traefik.http.routers.forma.rule: Host(`${LCT_DOMAIN:-forma.inflake.fun}`)
      traefik.http.routers.forma.tls: "true"
      traefik.http.routers.forma.tls.certresolver: ${LCT_TLS_RESOLVER:-leresolver}
      traefik.http.services.forma.loadbalancer.server.port: "8000"
      # Explicit opt-in: requires an already configured Watchtower on the host.
      com.centurylinklabs.watchtower.enable: ${LCT_WATCHTOWER_ENABLED:-false}
    networks: [intranet]

volumes:
  forma-data:
    name: forma-data

networks:
  intranet:
    external: true
    name: ${LCT_PROXY_NETWORK:-intranet}
