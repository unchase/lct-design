name: CI and Docker image

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the default branch image to the registry
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: forma-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  # Git Bash on the Windows runner must not rewrite container paths such as /data.
  MSYS_NO_PATHCONV: '1'
  PYTHONUTF8: '1'

jobs:
  verify:
    # Operator-managed Windows runner with Docker (Linux containers) and Git Bash.
    # Pull requests from forks never reach it; only same-repository branches run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, "${{ vars.FORMA_RUNNER_LABEL || 'forma-builder' }}"]
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      CI_IMAGE: forma:ci-${{ github.run_id }}-${{ github.run_attempt }}
      CI_CONTAINER: forma-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: |
          python -m venv .venv-ci
          .venv-ci/Scripts/python -m pip install --quiet -r requirements.lock
          .venv-ci/Scripts/python -m pip install --quiet --no-deps -e .
          .venv-ci/Scripts/python -m pip install --quiet 'pytest>=8,<10'
      - name: Python tests
        env:
          LCT_RENDERER: none
        run: .venv-ci/Scripts/python -m pytest -q
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build container
        run: docker build --tag "$CI_IMAGE" .
      - name: Start test service
        run: |
          docker run --detach --name "$CI_CONTAINER" --publish 127.0.0.1::8000 --cap-drop ALL --security-opt no-new-privileges "$CI_IMAGE"
          port=$(docker port "$CI_CONTAINER" 8000/tcp | head -n1 | sed 's/.*://')
          echo "LCT_TEST_URL=http://127.0.0.1:$port" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if curl --fail --silent "http://127.0.0.1:$port/api/health" > /dev/null; then exit 0; fi
            sleep 2
          done
          docker logs "$CI_CONTAINER"
          exit 1
      - name: Install browser
        working-directory: frontend
        run: npx playwright install chromium
      - name: Browser checks
        working-directory: frontend
        # The upload/generation scenario requires a user-owned PPTX and is skipped
        # when LCT_TEST_TEMPLATE is absent; no private templates enter this build.
        run: npx playwright test
      - name: Container logs on failure
        if: failure()
        run: docker logs "$CI_CONTAINER" || true
      - name: Remove test service
        if: always()
        run: |
          docker rm --force "$CI_CONTAINER" > /dev/null 2>&1 || true
          docker image rm "$CI_IMAGE" > /dev/null 2>&1 || true

  publish:
    needs: verify
    # Every push to the default branch publishes unless LCT_AUTO_PUBLISH is 'false';
    # a manual run publishes only when requested.
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish) ||
       (github.event_name == 'push' && vars.LCT_AUTO_PUBLISH != 'false'))
    runs-on: [self-hosted, "${{ vars.FORMA_RUNNER_LABEL || 'forma-builder' }}"]
    environment: production
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}
      - name: Build and publish tested revision
        shell: powershell
        env:
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $registry = $env:REGISTRY_HOST.Trim().TrimEnd('/')
          if (-not $registry -or $registry -match '[/\s]') { throw 'REGISTRY_HOST must be a hostname, optionally with a port' }
          if ($env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Invalid source revision' }
          $repository = "$registry/inflake/forma"
          $revisionImage = "${repository}:$($env:SOURCE_SHA)"
          $mainImage = "${repository}:main"
          docker build --pull --file Dockerfile --label "org.opencontainers.image.revision=$($env:SOURCE_SHA)" --tag $revisionImage --tag $mainImage .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker push $revisionImage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker push $mainImage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Published $revisionImage and $mainImage. Server activation is handled by Compose/Watchtower; this job does not verify the public service." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
