name: CI and Docker image

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the default branch image (production approval applies)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: forma-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install 'pytest>=8,<10'
      - name: Python tests
        env:
          LCT_RENDERER: none
        run: python -m pytest -q
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build container
        run: docker build --tag forma:ci .
      - name: Start test service
        run: |
          docker run --detach --name forma-ci --publish 127.0.0.1:8012:8000 --cap-drop ALL --security-opt no-new-privileges forma:ci
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8012/api/health > /dev/null; then exit 0; fi
            sleep 2
          done
          docker logs forma-ci
          exit 1
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser checks
        working-directory: frontend
        env:
          LCT_TEST_URL: http://127.0.0.1:8012
        # The upload/generation scenario requires a user-owned PPTX and is skipped
        # when LCT_TEST_TEMPLATE is absent; no private templates enter this build.
        run: npx playwright test
      - name: Container logs on failure
        if: failure()
        run: docker logs forma-ci || true
      - name: Stop test service
        if: always()
        run: docker rm --force forma-ci || true

  publish:
    needs: verify
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish) ||
       (github.event_name == 'push' && vars.LCT_AUTO_PUBLISH == 'true'))
    # Reuse an operator-managed Windows Docker builder.
    # Never run untrusted pull-request code on this runner.
    runs-on: [self-hosted, "${{ vars.FORMA_RUNNER_LABEL || 'forma-builder' }}"]
    environment: production
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}
      - name: Build and publish tested revision
        shell: powershell
        env:
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $registry = $env:REGISTRY_HOST.Trim().TrimEnd('/')
          if (-not $registry -or $registry -match '[/\s]') { throw 'REGISTRY_HOST must be a hostname, optionally with a port' }
          if ($env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Invalid source revision' }
          $repository = "$registry/inflake/forma"
          $revisionImage = "${repository}:$($env:SOURCE_SHA)"
          $mainImage = "${repository}:main"
          docker build --pull --file Dockerfile --label "org.opencontainers.image.revision=$($env:SOURCE_SHA)" --tag $revisionImage --tag $mainImage .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker push $revisionImage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker push $mainImage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Published $revisionImage and $mainImage. Server activation is handled by Compose/Watchtower; this job does not verify the public service." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
