[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lct-design"
version = "0.2.0"
description = "Template-aware editable presentation generation and audit"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "pydantic>=2.10,<3", "lxml>=5.3,<7", "Pillow>=11,<13", "httpx>=0.28,<1", "pypdf>=5,<7", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
lct-design = "lct_design.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lct_design = ["prompts/*.md", "assets/*.pptx", "assets/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
